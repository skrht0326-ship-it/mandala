<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>マンダラチャート帳</title>
<meta name="description" content="スマホとPCで同期するマンダラチャート。3×3・9×9・マインドマップ表示。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="マンダラ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161c" media="(prefers-color-scheme: dark)">
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: 上部に表示中チャート名、中央にマス目（3×3 / 9×9）かマインドマップ、下部固定のタブで表示を切り替える。マスをタップすると上から編集パネルが開く（スマホのキーボードに隠れないように上寄せ） */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --cell: #ffffff;
  --ink: #1d2430;
  --muted: #586273;
  --line: #c6cdd8;
  --accent: #3d5ea6;
  --accent-ink: #ffffff;
  --danger: #b23a3a;
  --done: #2e7d4f;
  --on-pastel: #18202b;
  --scrim: rgba(20, 26, 36, .45);
  --p-g: #c5e1a5; --p-p: #f4a3c0; --p-y: #ffe08a; --p-o: #ffc98a; --p-c: #8ee0ea;
  --p-b: #98cbf5; --p-t: #8dd0c6; --p-v: #a9b0e0; --p-r: #f2a7a0; --p-n: #e3e6eb;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --font-body: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  --tabbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161c; --surface: #1a2029; --cell: #222a35; --ink: #e7ecf2; --muted: #a3aebd;
    --line: #3a4554; --accent: #8fa9e8; --accent-ink: #10151c; --danger: #f09a9a; --done: #7bd39a;
    --on-pastel: #151a22; --scrim: rgba(0, 0, 0, .6);
    --p-g: #aecb8c; --p-p: #e295b2; --p-y: #ebcd72; --p-o: #eab474; --p-c: #79cdd7;
    --p-b: #86b8e2; --p-t: #7bbdb3; --p-v: #9aa1d4; --p-r: #e0968f; --p-n: #c4c9d1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161c; --surface: #1a2029; --cell: #222a35; --ink: #e7ecf2; --muted: #a3aebd;
  --line: #3a4554; --accent: #8fa9e8; --accent-ink: #10151c; --danger: #f09a9a; --done: #7bd39a;
  --on-pastel: #151a22; --scrim: rgba(0, 0, 0, .6);
  --p-g: #aecb8c; --p-p: #e295b2; --p-y: #ebcd72; --p-o: #eab474; --p-c: #79cdd7;
  --p-b: #86b8e2; --p-t: #7bbdb3; --p-v: #9aa1d4; --p-r: #e0968f; --p-n: #c4c9d1;
  color-scheme: dark;
}

* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); }
html { -webkit-text-size-adjust: 100%; }
body::before {
  content: "";
  position: fixed;
  top: 0; left: 0; right: 0;
  height: env(safe-area-inset-top, 0px);
  background: var(--bg);
  z-index: 30;
}
.icon-btn svg { width: 24px; height: 24px; }
#syncBtn[data-state="busy"] svg { animation: spin 1.2s linear infinite; }
#syncBtn[data-state="error"] { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 55%, var(--line)); }
#syncBtn[data-state="ok"] { color: var(--done); }
@keyframes spin { to { transform: rotate(360deg); } }
.code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; word-break: break-all; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.6;
  padding-block: 0 calc(var(--tabbar-h) + 24px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
button:focus-visible, textarea:focus-visible, input:focus-visible {
  outline: 2.5px solid var(--accent);
  outline-offset: 2px;
}

/* ヘッダー */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
  display: flex;
  align-items: center;
  gap: 8px;
  padding-block: 10px;
  max-width: 760px;
  margin: 0 auto;
}
.chart-btn {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  text-align: left;
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 12px;
  padding: 6px 12px;
  cursor: pointer;
}
.chart-btn .eyebrow { font-size: 11px; color: var(--muted); letter-spacing: .06em; }
.chart-btn .name {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 17px;
  line-height: 1.35;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.chart-btn .name::after { content: " ▾"; color: var(--muted); font-size: 13px; }
.icon-btn {
  flex: none;
  width: 48px; height: 48px;
  border-radius: 12px;
  border: 1.5px solid var(--line);
  background: var(--surface);
  font-size: 20px;
  cursor: pointer;
  display: grid;
  place-items: center;
}
.icon-btn:disabled { opacity: .35; cursor: default; }
.status {
  max-width: 760px;
  margin: -4px auto 8px;
  font-size: 12px;
  color: var(--muted);
  min-height: 1.6em;
}
.status.err { color: var(--danger); }

main { max-width: 760px; margin: 0 auto; }
.view[hidden] { display: none; }

/* マス */
.cell {
  position: relative;
  aspect-ratio: 1;
  max-width: 100%;
  min-width: 0;
  container-type: inline-size;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  background: var(--cell);
  color: var(--ink);
  padding: 0;
  cursor: pointer;
  display: grid;
  place-items: center;
  overflow: hidden;
  transition: transform .12s ease;
}
.cell:active { transform: scale(.97); }
.cell .tx {
  display: block;
  width: 88%;
  max-width: 92%;
  text-align: center;
  line-height: 1.22;
  white-space: pre-line;
  overflow-wrap: anywhere;
  font-weight: 500;
}
.cell.tint { background: color-mix(in srgb, var(--k) 16%, var(--cell)); border-color: color-mix(in srgb, var(--k) 45%, var(--line)); }
.cell.filled { background: var(--k); border-color: color-mix(in srgb, var(--k) 70%, var(--on-pastel)); color: var(--on-pastel); }
.cell.center .tx { font-family: var(--font-display); font-weight: 700; }
.cell.empty .plus { color: var(--muted); opacity: .45; font-size: 28cqi; line-height: 1; }
.cell.done::after {
  content: "✓";
  position: absolute;
  top: 4%; right: 5%;
  width: 22cqi; height: 22cqi;
  min-width: 12px; min-height: 12px;
  border-radius: 50%;
  background: var(--done);
  color: var(--surface);
  font-size: max(9px, 13cqi);
  font-weight: 700;
  display: grid;
  place-items: center;
  line-height: 1;
}
.cell.theme .go {
  position: absolute;
  bottom: 5%; right: 6%;
  font-size: max(10px, 12cqi);
  opacity: .6;
}

/* 3×3 */
.crumb {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin: 4px 0 12px;
  min-height: 40px;
}
.crumb .hint { color: var(--muted); font-size: 13px; }
.crumb .here { font-family: var(--font-display); font-weight: 700; font-size: 16px; min-width: 0; overflow-wrap: anywhere; }
.g3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 7px;
  width: min(100%, 520px);
  margin: 0 auto;
}
.minimap-wrap { margin: 20px auto 0; width: min(100%, 520px); }
.minimap-wrap h2 { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: .06em; margin: 0 0 6px; }
.minimap {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 5px;
}
.mm {
  border: 1.5px solid var(--line);
  border-radius: 8px;
  background: var(--cell);
  padding: 6px 4px;
  min-height: 44px;
  font-size: 12px;
  line-height: 1.3;
  cursor: pointer;
  overflow: hidden;
  overflow-wrap: anywhere;
}
.mm.filled { background: var(--k); color: var(--on-pastel); border-color: transparent; }
.mm[aria-current="true"] { outline: 3px solid var(--ink); outline-offset: 1px; }
.mm .ct { display: block; font-size: 10.5px; opacity: .75; font-variant-numeric: tabular-nums; }

/* 9×9 */
.v9-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 4px 0 12px; }
.v9-bar .hint { color: var(--muted); font-size: 13px; }
.scroller { overflow-x: auto; padding-bottom: 6px; }
.g9 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 5px;
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
}
.g9.zoom { width: 760px; max-width: none; }
.blk { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; }
.g9 .cell { border-radius: 4px; border-width: 1px; }
.g9 .cell.empty .plus { display: none; }

/* マインドマップ */
.map-bar { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 14px; }
.map { overflow-x: auto; padding-bottom: 8px; }
.tree, .tree ul { list-style: none; margin: 0; padding: 0; }
.tree li { position: relative; display: flex; align-items: center; padding-left: 14px; }
.tree > li { padding-left: 0; }
.tree ul {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding-left: 14px;
  gap: 4px;
  min-width: 0;
}
.tree ul::before { content: ""; position: absolute; left: 0; top: 50%; width: 14px; border-top: 2px solid var(--line); }
.tree ul > li::before { content: ""; position: absolute; left: 0; top: 50%; width: 14px; border-top: 2px solid var(--line); }
.tree ul > li::after { content: ""; position: absolute; left: 0; top: -2px; bottom: -2px; border-left: 2px solid var(--line); }
.tree ul > li:first-child::after { top: 50%; }
.tree ul > li:last-child::after { bottom: 50%; }
.tree ul > li:only-child::after { display: none; }
.node {
  flex: none;
  border: 1.5px solid var(--line);
  background: var(--cell);
  color: var(--ink);
  border-radius: 10px;
  padding: 7px 11px;
  text-align: left;
  cursor: pointer;
  white-space: pre-line;
  overflow-wrap: anywhere;
  line-height: 1.4;
  position: relative;
}
.root > .node {
  width: 96px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 16px;
  padding: 12px;
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}
.root > .node.filled { background: var(--k); color: var(--on-pastel); border-color: transparent; }
.bnode { flex: none; display: flex; align-items: stretch; width: 128px; }
.bnode .node {
  flex: 1;
  min-width: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 15px;
  border-radius: 10px 0 0 10px;
  background: color-mix(in srgb, var(--k) 25%, var(--cell));
  border-color: color-mix(in srgb, var(--k) 60%, var(--line));
}
.bnode .node.filled { background: var(--k); color: var(--on-pastel); }
.fold {
  flex: none;
  width: 30px;
  border: 1.5px solid color-mix(in srgb, var(--k) 60%, var(--line));
  border-left: none;
  border-radius: 0 10px 10px 0;
  background: var(--surface);
  cursor: pointer;
  font-size: 12px;
  color: var(--muted);
}
.fold .ct { display: block; font-size: 10px; font-variant-numeric: tabular-nums; }
.leaf > .node { width: min(54vw, 210px); font-size: 13.5px; }
.leaf > .node.filled { background: var(--k); color: var(--on-pastel); border-color: transparent; }
.leaf > .node.tint { border-color: color-mix(in srgb, var(--k) 55%, var(--line)); }
.node.empty { border-style: dashed; color: var(--muted); background: transparent; }
.node.done { padding-right: 30px; }
.node.done::after {
  content: "✓";
  position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--done); color: var(--surface);
  font-size: 11px; font-weight: 700; display: grid; place-items: center;
}

/* ボタン */
.btn {
  border: 1.5px solid var(--line);
  background: var(--surface);
  border-radius: 10px;
  min-height: 44px;
  padding: 0 14px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
}
.btn.small { min-height: 38px; font-size: 13px; padding: 0 12px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 55%, var(--line)); }
.btn.armed { background: var(--danger); color: var(--surface); border-color: var(--danger); }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn[hidden] { display: none; }

/* 下部タブ */
.tabbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 20;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.tabs {
  max-width: 520px;
  margin: 0 auto;
  height: var(--tabbar-h);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  padding-block: 8px;
}
.tab {
  border: none;
  border-radius: 12px;
  background: transparent;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
}
.tab svg { width: 22px; height: 22px; }
.tab[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 16%, var(--surface)); color: var(--accent); font-weight: 700; }

/* パネル */
.scrim {
  position: fixed;
  inset: 0;
  z-index: 40;
  background: var(--scrim);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-left: max(10px, env(safe-area-inset-left, 0px));
  padding-right: max(10px, env(safe-area-inset-right, 0px));
}
.sheet {
  width: min(100%, 520px);
  max-height: calc(100% - 20px);
  overflow-y: auto;
  background: var(--surface);
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 14px 40px rgba(0, 0, 0, .25);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.sheet-head { display: flex; align-items: baseline; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.sheet h2 { font-family: var(--font-display); font-weight: 700; font-size: 18px; margin: 0; text-wrap: balance; }
.sheet h3 { font-size: 12px; font-weight: 500; letter-spacing: .06em; color: var(--muted); margin: 6px 0 0; }
.where { font-size: 12.5px; color: var(--muted); }
textarea {
  width: 100%;
  font: inherit;
  font-size: 18px;
  line-height: 1.45;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  background: var(--cell);
  color: var(--ink);
  padding: 10px 12px;
  resize: vertical;
}
.counter { font-size: 12px; color: var(--muted); text-align: right; margin-top: -8px; font-variant-numeric: tabular-nums; }
.counter.over { color: var(--danger); }
fieldset { border: none; padding: 0; margin: 0; }
legend { font-size: 12px; color: var(--muted); letter-spacing: .06em; margin-bottom: 6px; padding: 0; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
.sw {
  height: 44px;
  border-radius: 10px;
  border: 1.5px solid var(--line);
  background: var(--k, var(--cell));
  cursor: pointer;
  font-size: 11px;
  color: var(--on-pastel);
}
.sw.none { color: var(--muted); background: var(--cell); }
.sw[aria-pressed="true"] { outline: 3px solid var(--ink); outline-offset: 1px; }
.toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
  font-weight: 500;
  cursor: pointer;
}
.toggle input { width: 22px; height: 22px; accent-color: var(--done); }
.sheet-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sheet-actions .sp { flex: 1; }
.clist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.clist li { display: flex; gap: 6px; align-items: stretch; }
.copen {
  flex: 1;
  min-width: 0;
  text-align: left;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  background: var(--cell);
  padding: 8px 12px;
  cursor: pointer;
}
.copen[aria-current="true"] { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }
.copen b { display: block; font-family: var(--font-display); font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.copen span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.msg { font-size: 13px; margin: 0; min-height: 1.4em; color: var(--done); }
.msg.err { color: var(--danger); }
.note { font-size: 12px; color: var(--muted); margin: 0; line-height: 1.6; }
.copybox { width: 100%; font-size: 13px; min-height: 160px; }

.empty-state {
  background: var(--surface);
  border: 1.5px dashed var(--line);
  border-radius: 14px;
  padding: 28px 20px;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: center;
}
.empty-state h2 { font-family: var(--font-display); margin: 0; font-size: 18px; }
.empty-state p { margin: 0; color: var(--muted); }

/* スマホ幅では縦に並ぶアウトライン型のマップにする */
@media (max-width: 640px) {
  .tree li { display: block; padding-left: 0; }
  .tree ul { gap: 6px; padding-left: 22px; margin-top: 6px; }
  .tree ul::before { display: none; }
  .tree ul > li::before { left: -12px; top: 20px; width: 12px; }
  .tree ul > li::after { left: -12px; top: -6px; bottom: 0; }
  .tree ul > li:first-child::after { top: -6px; }
  .tree ul > li:last-child::after,
  .tree ul > li:only-child::after { display: block; bottom: auto; height: 26px; }
  .root > .node { width: auto; max-width: 100%; }
  .bnode { width: min(100%, 260px); }
  .leaf > .node { width: auto; max-width: 100%; min-width: 120px; }
}
@media (min-width: 700px) {
  .scrim { align-items: center; }
  .leaf > .node { width: 220px; }
  .bnode { width: 150px; }
  .root > .node { width: 130px; font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) {
  .cell { transition: none; }
  .cell:active { transform: none; }
}
</style>

<header class="top">
  <button id="chartBtn" class="chart-btn" type="button" aria-haspopup="dialog">
    <span class="eyebrow">マンダラチャート</span>
    <span id="chartName" class="name">チャートなし</span>
  </button>
  <button id="undoBtn" class="icon-btn" type="button" aria-label="元に戻す" title="元に戻す" disabled>↶</button>
  <button id="syncBtn" class="icon-btn" type="button" aria-label="同期の設定" title="同期の設定" data-state="off">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 8.5a4 4 0 0 1-.5 9.5H7z"/><path d="M10 13.5l2-2 2 2M12 11.5V16"/></svg>
  </button>
</header>
<div id="status" class="status" role="status" aria-live="polite"></div>

<main>
  <div id="emptyState" class="empty-state" hidden>
    <h2>チャートがまだありません</h2>

<div id="stWrap" class="scrim" hidden>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="stTitle">
    <div class="sheet-head">
      <h2 id="stTitle">スマホとPCの同期</h2>
      <button id="stClose" class="btn small" type="button">閉じる</button>
    </div>
    <p id="stState" class="note"></p>
    <div id="stConnectBox">
      <label for="stCode" class="note">接続コード（MANDALA1: から始まる文字列）</label>
      <textarea id="stCode" class="code" rows="3" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
      <div class="sheet-actions" style="margin-top:8px">
        <button id="stConnect" class="btn primary" type="button">接続する</button>

    </div>

    </div>
    <textarea id="stCodeView" class="code" rows="3" readonly hidden aria-label="接続コード"></textarea>
    <p id="stMsg" class="msg" role="status"></p>
    <p class="note">接続コードには合言葉が含まれます。人に見せたり、公開の場所に貼ったりしないでください。データはGoogleドライブの「03_アプリ作成_マインドマップ、マンダラチャート」フォルダの mandala-sync.json に保存され、1日1回バックアップされます。</p>
  </section>
</div>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var ORDER = [0, 1, 2, 5, 8, 7, 6, 3]; // 時計回り（左上から）
  var MAXLEN = 36;
  var COLORS = [['', 'なし'], ['g', '若草'], ['p', '桃'], ['y', '山吹'], ['o', '橙'], ['c', '水'], ['b', '空'], ['t', '青竹'], ['v', '藤'], ['r', '珊瑚'], ['n', '灰']];
  var COLOR_KEYS = COLORS.map(function (c) { return c[0]; });
  var DATA_KEY = 'mandala-pwa-data-v1';
  var CONF_KEY = 'mandala-pwa-sync-v1';
  var UI_KEY = 'mandala-pwa-ui-v1';
  var CODE_PREFIX = 'MANDALA1:';

  // ---------- データ ----------
  function emptyCell() { return { t: '', c: '', d: false, u: 0 }; }
  function blank() {
    var b = [];
    for (var i = 0; i < 9; i++) { var r = []; for (var j = 0; j < 9; j++) r.push(emptyCell()); b.push(r); }
    return b;
  }
  function uid() { return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function newChart() { var n = Date.now(); return { id: uid(), blocks: blank(), created: n, updated: n }; }
  function clone(x) { return JSON.parse(JSON.stringify(x)); }

  function normCell(c) {
    c = c && typeof c === 'object' ? c : {};
    var t = typeof c.t === 'string' ? c.t.replace(/\r/g, '') : '';
    return { t: Array.from(t).slice(0, MAXLEN).join(''), c: COLOR_KEYS.indexOf(c.c) >= 0 ? c.c : '', d: !!c.d, u: +c.u || 0 };
  }
  function normalize(raw, id) {
    if (!raw || !Array.isArray(raw.blocks)) return null;
    var b = [];
    for (var i = 0; i < 9; i++) {
      var r = [], src = Array.isArray(raw.blocks[i]) ? raw.blocks[i] : [];
      for (var j = 0; j < 9; j++) r.push(normCell(src[j]));
      b.push(r);
    }
    return { id: id || raw.id || uid(), blocks: b, created: +raw.created || Date.now(), updated: +raw.updated || Date.now() };
  }
  // マス単位で新しい方を採用（サーバー側と同じ規則）
  function mergeChart(a, b) {
    if (!a) return b;
    if (!b) return a;
    var out = { id: a.id, blocks: [], created: Math.min(a.created || 0, b.created || 0) || a.created || b.created, updated: Math.max(a.updated || 0, b.updated || 0) };
    for (var i = 0; i < 9; i++) {
      var row = [];
      for (var j = 0; j < 9; j++) {
        var x = a.blocks[i][j], y = b.blocks[i][j];
        row.push((y.u || 0) > (x.u || 0) ? y : x);
      }
      out.blocks.push(row);
    }
    return out;
  }
  function sameChart(a, b) { return JSON.stringify(a) === JSON.stringify(b); }

  // 外周ブロックの中心は、中心ブロックのテーマと同じマス
  function canon(b, i) { return (b !== 4 && i === 4) ? [4, b] : [b, i]; }
  function chartName(ch) { var t = ch.blocks[4][4].t.replace(/\n/g, ' ').trim(); return t || '無題のチャート'; }
  function filledCount(ch) {
    var n = 0;
    for (var b = 0; b < 9; b++) for (var i = 0; i < 9; i++) if (!(b !== 4 && i === 4) && ch.blocks[b][i].t) n++;
    return n;
  }

  // ---------- 状態 ----------
  var charts = {};
  var deleted = {};   // 削除したチャートの記録（他の端末にも削除を伝える）
  var dirty = {};     // サーバーへ送っていない変更があるチャート
  var conf = null;    // {u: 同期URL, k: 合言葉}
  var curId = null;
  var view = 'v3';
  var block = 4;
  var showEmpty = false;
  var zoom = false;
  var collapsed = {};
  var undoStack = [];
  var sync = { busy: false, again: false, timer: null, last: 0, state: 'off', err: '' };

  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }

  function loadAll() {
    var d = lsGet(DATA_KEY);
    if (d) {
      (d.charts || []).forEach(function (c) { var n = normalize(c); if (n) charts[n.id] = n; });
      deleted = d.deleted || {};
      (d.dirty || []).forEach(function (id) { dirty[id] = true; });
      sync.last = +d.last || 0;
    }
    conf = lsGet(CONF_KEY);
    var u = lsGet(UI_KEY) || {};
    if (u.view) view = u.view;
    if (typeof u.block === 'number') block = u.block;
    showEmpty = !!u.showEmpty;
    zoom = !!u.zoom;
    if (u.curId) curId = u.curId;
  }
  function saveData() {
    var ok = lsSet(DATA_KEY, { charts: Object.keys(charts).map(function (k) { return charts[k]; }), deleted: deleted, dirty: Object.keys(dirty), last: sync.last });
    if (!ok) setStatus('この端末に保存できませんでした。JSONで書き出して保管してください。', true);
  }
  function saveUI() { lsSet(UI_KEY, { view: view, block: block, showEmpty: showEmpty, zoom: zoom, curId: curId }); }

  function cur() { return curId ? charts[curId] : null; }
  function sortedIds() { return Object.keys(charts).sort(function (a, b) { return charts[b].updated - charts[a].updated; }); }
  function ensureCur() { if (!curId || !charts[curId]) curId = sortedIds()[0] || null; }

  // ---------- 状態表示 ----------
  function hm(n) { var d = new Date(n); return d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); }
  function setStatus(t, err) {
    var s = $('#status');
    s.textContent = t;
    s.className = 'status' + (err ? ' err' : '');
  }
  function showSyncState() {
    var b = $('#syncBtn');
    b.dataset.state = sync.state;
    var pending = Object.keys(dirty).length;
    if (!conf) { setStatus('同期は未設定です（この端末だけに保存）。右上の雲マークから設定できます。'); return; }
    if (sync.state === 'busy') { setStatus('同期中…'); return; }
    if (sync.state === 'error') {
      setStatus(sync.err === 'bad_token'
        ? '接続コードが正しくありません。同期の設定を確認してください。'
        : 'オフラインです。変更はこの端末に保存済みで、つながると自動で同期します。' + (pending ? '（未送信 ' + pending + '件）' : ''), sync.err === 'bad_token');
      return;
    }
    setStatus(pending ? '変更を送信待ち…' : (sync.last ? '同期済み ' + hm(sync.last) + '（スマホ・PC共通）' : '同期の準備中…'));
  }

  // ---------- 同期 ----------
  function scheduleSync(ms) {
    if (!conf) return;
    clearTimeout(sync.timer);
    sync.timer = setTimeout(runSync, ms);
  }
  function runSync() {
    if (!conf) return Promise.resolve();
    if (sync.busy) { sync.again = true; return Promise.resolve(); }
    sync.busy = true;
    sync.state = 'busy';
    showSyncState();
    var sendIds = Object.keys(dirty);
    var payload = { token: conf.k, charts: sendIds.map(function (id) { return charts[id]; }).filter(Boolean), deleted: deleted };
    sendIds.forEach(function (id) { delete dirty[id]; });
    return fetch(conf.u, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload), redirect: 'follow' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || !j.ok) { var e = new Error((j && j.error) || 'server'); e.code = (j && j.error) || 'server'; throw e; }
        applyServer(j);
        sync.state = 'ok';
        sync.err = '';
        sync.last = Date.now();
      })
      .catch(function (e) {
        sendIds.forEach(function (id) { dirty[id] = true; });
        sync.state = 'error';
        sync.err = e && e.code ? e.code : 'network';
      })
      .then(function () {
        sync.busy = false;
        saveData();
        render();
        showSyncState();
        if (sync.again) { sync.again = false; scheduleSync(300); }
      });
  }
  function applyServer(j) {
    var sc = j.charts || {};
    Object.keys(sc).forEach(function (id) {
      var s = normalize(sc[id], id);
      if (!s) return;
      var mine = charts[id];
      var merged = mergeChart(mine, s);
      charts[id] = merged;
      if (mine && !sameChart(merged, s)) dirty[id] = true; // 手元の方が新しいマスがある
    });
    var sd = j.deleted || {};
    Object.keys(sd).forEach(function (id) { if (!deleted[id] || deleted[id] < sd[id]) deleted[id] = sd[id]; });
    Object.keys(deleted).forEach(function (id) {
      if (charts[id] && charts[id].updated <= deleted[id]) { delete charts[id]; delete dirty[id]; }
    });
    // サーバーにない手元のチャートは送る
    Object.keys(charts).forEach(function (id) { if (!sc[id]) dirty[id] = true; });
    ensureCur();
    if (Object.keys(dirty).length) sync.again = true;
  }

  function markChanged(id) {
    dirty[id] = true;
    saveData();
    if (conf) { sync.state = sync.state === 'error' ? 'error' : 'ok'; scheduleSync(1200); }
    showSyncState();
  }

  // 変更の入口：元に戻す用に直前の状態を積む
  function commit(id, fn) {
    var ch = charts[id];
    if (!ch) return;
    undoStack.push({ id: id, snap: clone(ch) });
    if (undoStack.length > 40) undoStack.shift();
    fn(ch);
    ch.updated = Date.now();
    markChanged(id);
    render();
  }
  function undo() {
    var u = undoStack.pop();
    if (!u) return;
    var now = Date.now();
    if (u.snap === null) { // 追加したチャートの取り消し
      delete charts[u.id];
      deleted[u.id] = now;
      delete dirty[u.id];
      if (curId === u.id) { curId = null; ensureCur(); }
    } else {
      var curr = charts[u.id];
      var snap = u.snap;
      for (var b = 0; b < 9; b++) for (var i = 0; i < 9; i++) {
        var s = snap.blocks[b][i], c = curr ? curr.blocks[b][i] : null;
        if (!c || s.t !== c.t || s.c !== c.c || s.d !== c.d) s.u = now;
      }
      snap.updated = now;
      charts[u.id] = snap;
      if (deleted[u.id]) delete deleted[u.id];
      curId = u.id;
      dirty[u.id] = true;
    }
    saveData();
    saveUI();
    scheduleSync(800);
    render();
    showSyncState();
  }

  // ---------- 描画 ----------
  function textUnits(s) {
    var n = 0;
    Array.from(s).forEach(function (ch) { n += /[\x20-\x7e]/.test(ch) ? 0.58 : 1; });
    return n;
  }
  // マスに収まる文字サイズ（cqi単位）と、狙った位置で折り返すための幅
  function fitSize(t) {
    t = t.trim();
    if (!t) return { fs: 20, w: 88 };
    var segs = t.split('\n').map(textUnits);
    var maxSeg = Math.max.apply(null, segs.concat([1]));
    var opts = [];
    for (var cpl = 1; cpl <= Math.ceil(maxSeg); cpl++) {
      var lines = 0;
      segs.forEach(function (s) { lines += Math.max(1, Math.ceil(s / cpl)); });
      opts.push({ cpl: cpl, lines: lines, fs: Math.min(82 / cpl, 82 / (lines * 1.24), 23) });
    }
    var best = Math.max.apply(null, opts.map(function (o) { return o.fs; }));
    // 同じ大きさなら行数が少なく、行の長さがそろう組み方を選ぶ
    var pick = opts.filter(function (o) { return o.fs >= best - 0.01; })
      .sort(function (x, y) { return x.lines - y.lines || x.cpl - y.cpl; })[0];
    var bestCpl = pick.cpl;
    best = Math.max(best, 7);
    return { fs: best, w: Math.min(92, bestCpl * best + 2) };
  }

  function cellEl(cell, opt) {
    var el = document.createElement('button');
    el.type = 'button';
    el.className = 'cell';
    if (opt.center) el.classList.add('center');
    if (cell.c) { el.classList.add('filled'); el.style.setProperty('--k', 'var(--p-' + cell.c + ')'); }
    else if (opt.tint) { el.classList.add('tint'); el.style.setProperty('--k', 'var(--p-' + opt.tint + ')'); }
    if (cell.d) el.classList.add('done');
    if (cell.t) {
      var tx = document.createElement('span');
      tx.className = 'tx';
      tx.textContent = cell.t;
      var f = fitSize(cell.t);
      tx.style.fontSize = f.fs.toFixed(1) + 'cqi';
      tx.style.width = f.w.toFixed(1) + 'cqi';
      el.appendChild(tx);
    } else {
      el.classList.add('empty');
      var p = document.createElement('span');
      p.className = 'plus';
      p.textContent = '＋';
      p.setAttribute('aria-hidden', 'true');
      el.appendChild(p);
    }
    el.setAttribute('aria-label', (cell.t || '空きマス') + (cell.d ? '（達成）' : ''));
    return el;
  }

  function render() {
    var ch = cur();
    $('#chartName').textContent = ch ? chartName(ch) : 'チャートなし';
    $('#undoBtn').disabled = !undoStack.length;
    $('#emptyState').hidden = !!ch;
    $('#emptySync').hidden = !!conf;
    ['v3', 'v9', 'vm'].forEach(function (v) { $('#' + v).hidden = !ch || v !== view; });
    document.querySelectorAll('.tab').forEach(function (t) { t.setAttribute('aria-selected', String(t.dataset.view === view)); });
    if (!$('#csWrap').hidden) renderList();
    if (!ch) return;
    if (view === 'v3') render3(ch);
    else if (view === 'v9') render9(ch);
    else renderMap(ch);
  }

  function render3(ch) {
    var g = $('#g3');
    g.textContent = '';
    var b = block;
    var tint = b === 4 ? '' : ch.blocks[4][b].c;
    for (var i = 0; i < 9; i++) {
      (function (i) {
        var c = canon(b, i);
        var cell = ch.blocks[c[0]][c[1]];
        var el = cellEl(cell, { center: i === 4, tint: (b !== 4 && i !== 4) ? tint : '' });
        if (b === 4 && i !== 4) {
          el.classList.add('theme');
          var go = document.createElement('span');
          go.className = 'go';
          go.textContent = '開く ›';
          go.setAttribute('aria-hidden', 'true');
          el.appendChild(go);
          el.setAttribute('aria-label', (cell.t || '空きテーマ') + 'の3×3を開く');
          el.addEventListener('click', function () { goBlock(i); });
        } else {
          el.addEventListener('click', function () { openEditor(c[0], c[1]); });
        }
        g.appendChild(el);
      })(i);
    }
    var cr = $('#crumb');
    cr.textContent = '';
    if (b === 4) {
      var h = document.createElement('span');
      h.className = 'hint';
      h.textContent = '中心：目標をタップで編集。周りのテーマをタップするとその3×3を開きます。';
      cr.appendChild(h);
    } else {
      var back = document.createElement('button');
      back.type = 'button';
      back.className = 'btn small';
      back.textContent = '‹ 中心へ戻る';
      back.addEventListener('click', function () { goBlock(4); });
      var here = document.createElement('span');
      here.className = 'here';
      here.textContent = (ch.blocks[4][b].t || '（テーマ未設定）').replace(/\n/g, ' ');
      cr.appendChild(back);
      cr.appendChild(here);
    }
    var mm = $('#minimap');
    mm.textContent = '';
    for (var k = 0; k < 9; k++) {
      (function (k) {
        var th = ch.blocks[4][k];
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'mm';
        if (th.c) { btn.classList.add('filled'); btn.style.setProperty('--k', 'var(--p-' + th.c + ')'); }
        btn.setAttribute('aria-current', String(k === block));
        var n = 0;
        if (k !== 4) for (var i = 0; i < 9; i++) if (i !== 4 && ch.blocks[k][i].t) n++;
        btn.textContent = (th.t || (k === 4 ? '中心' : '未設定')).replace(/\n/g, ' ');
        var ct = document.createElement('span');
        ct.className = 'ct';
        ct.textContent = k === 4 ? '中心' : n + ' / 8';
        btn.appendChild(ct);
        btn.addEventListener('click', function () { goBlock(k); });
        mm.appendChild(btn);
      })(k);
    }
  }

  function render9(ch) {
    var g = $('#g9');
    g.textContent = '';
    g.classList.toggle('zoom', zoom);
    $('#zoomBtn').setAttribute('aria-pressed', String(zoom));
    for (var b = 0; b < 9; b++) {
      var blk = document.createElement('div');
      blk.className = 'blk';
      var tint = ch.blocks[4][b].c;
      for (var i = 0; i < 9; i++) {
        (function (b, i) {
          var c = canon(b, i);
          var cell = ch.blocks[c[0]][c[1]];
          var el = cellEl(cell, { center: i === 4, tint: b !== 4 ? tint : '' });
          el.addEventListener('click', function () { openEditor(c[0], c[1]); });
          blk.appendChild(el);
        })(b, i);
      }
      g.appendChild(blk);
    }
  }

  function nodeBtn(cell, b, i, cls) {
    var el = document.createElement('button');
    el.type = 'button';
    el.className = 'node';
    if (cls) el.classList.add(cls);
    if (cell.c) { el.classList.add('filled'); el.style.setProperty('--k', 'var(--p-' + cell.c + ')'); }
    if (cell.d) el.classList.add('done');
    if (cell.t) el.textContent = cell.t;
    else { el.classList.add('empty'); el.textContent = '＋ 空き'; }
    el.addEventListener('click', function () { openEditor(b, i); });
    return el;
  }

  function renderMap(ch) {
    $('#emptyBtn').setAttribute('aria-pressed', String(showEmpty));
    var tree = $('#tree');
    tree.textContent = '';
    var root = document.createElement('li');
    root.className = 'root';
    root.appendChild(nodeBtn(ch.blocks[4][4], 4, 4));
    var kids = document.createElement('ul');
    ORDER.forEach(function (b) {
      var th = ch.blocks[4][b];
      var items = ORDER.map(function (i) { return [i, ch.blocks[b][i]]; });
      var filled = items.filter(function (x) { return x[1].t; });
      if (!showEmpty && !th.t && !filled.length) return;
      var li = document.createElement('li');
      li.className = 'branch';
      var k = th.c || 'n';
      li.style.setProperty('--k', 'var(--p-' + k + ')');
      var wrap = document.createElement('div');
      wrap.className = 'bnode';
      wrap.appendChild(nodeBtn(th, 4, b));
      var fold = document.createElement('button');
      fold.type = 'button';
      fold.className = 'fold';
      var isC = !!collapsed[b];
      fold.setAttribute('aria-expanded', String(!isC));
      fold.setAttribute('aria-label', (th.t || 'テーマ') + 'を' + (isC ? '開く' : '閉じる'));
      fold.innerHTML = (isC ? '▸' : '▾') + '<span class="ct"></span>';
      fold.querySelector('.ct').textContent = filled.length;
      fold.addEventListener('click', function () { collapsed[b] = !collapsed[b]; render(); });
      wrap.appendChild(fold);
      li.appendChild(wrap);
      if (!isC) {
        var ul = document.createElement('ul');
        (showEmpty ? items : filled).forEach(function (x) {
          var l = document.createElement('li');
          l.className = 'leaf';
          l.style.setProperty('--k', 'var(--p-' + k + ')');
          l.appendChild(nodeBtn(x[1], b, x[0], x[1].c ? '' : 'tint'));
          ul.appendChild(l);
        });
        if (ul.children.length) li.appendChild(ul);
      }
      kids.appendChild(li);
    });
    if (kids.children.length) root.appendChild(kids);
    tree.appendChild(root);
  }

  function goBlock(b) {
    block = b;
    view = 'v3';
    saveUI();
    render();
    window.scrollTo(0, 0);
  }
  function setView(v) { view = v; saveUI(); render(); }

  // ---------- マス編集 ----------
  var ed = null;
  var edColor = '';
  var clearArmed = false, clearTimer;
  function whereText(b, i) {
    var ch = cur();
    if (b === 4 && i === 4) return '中心の目標';
    if (b === 4) return 'テーマ ' + (ORDER.indexOf(i) + 1) + ' / 8';
    var th = ch.blocks[4][b].t.replace(/\n/g, ' ') || 'テーマ未設定';
    return th + ' の行動 ' + (ORDER.indexOf(i) + 1) + ' / 8';
  }
  function openEditor(b, i) {
    var ch = cur();
    if (!ch) return;
    ed = { b: b, i: i, id: curId };
    var cell = ch.blocks[b][i];
    $('#edTitle').textContent = (b === 4 && i === 4) ? '目標を編集' : (b === 4 ? 'テーマを編集' : 'マスを編集');
    $('#edWhere').textContent = whereText(b, i);
    $('#edText').value = cell.t;
    $('#edDone').checked = cell.d;
    edColor = cell.c;
    $('#edOpen').hidden = !(b === 4 && i !== 4);
    disarmClear();
    paintColors();
    updateCount();
    $('#edWrap').hidden = false;
    setTimeout(function () { var t = $('#edText'); t.focus(); t.setSelectionRange(t.value.length, t.value.length); }, 30);
  }
  function closeEditor() { $('#edWrap').hidden = true; ed = null; disarmClear(); }
  function paintColors() {
    var box = $('#edColors');
    box.textContent = '';
    COLORS.forEach(function (c) {
      var s = document.createElement('button');
      s.type = 'button';
      s.className = 'sw' + (c[0] ? '' : ' none');
      if (c[0]) s.style.setProperty('--k', 'var(--p-' + c[0] + ')');
      s.textContent = c[1];
      s.setAttribute('aria-pressed', String(edColor === c[0]));
      s.addEventListener('click', function () { edColor = c[0]; paintColors(); });
      box.appendChild(s);
    });
  }
  function updateCount() {
    var n = Array.from($('#edText').value).length;
    var el = $('#edCount');
    el.textContent = n + ' / ' + MAXLEN;
    el.classList.toggle('over', n >= MAXLEN);
  }
  function saveEditor() {
    if (!ed) return;
    var e = ed;
    var t = Array.from($('#edText').value.replace(/\r/g, '').replace(/^\s+|\s+$/g, '')).slice(0, MAXLEN).join('');
    var d = $('#edDone').checked;
    var c = edColor;
    closeEditor();
    var ch = charts[e.id];
    if (!ch) return;
    var old = ch.blocks[e.b][e.i];
    if (old.t === t && old.d === d && old.c === c) return;
    commit(e.id, function (ch) { ch.blocks[e.b][e.i] = { t: t, c: c, d: d, u: Date.now() }; });
  }
  function disarmClear() {
    clearArmed = false;
    clearTimeout(clearTimer);
    var b = $('#edClear');
    b.textContent = '消去';
    b.classList.remove('armed');
  }

  // ---------- チャート一覧 ----------
  var delArmed = null, delTimer;
  function fmtDate(n) {
    var d = new Date(n);
    return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hm(n);
  }
  function renderList() {
    var ul = $('#csList');
    ul.textContent = '';
    var ids = sortedIds();
    if (!ids.length) {
      var li0 = document.createElement('li');
      li0.className = 'note';
      li0.textContent = 'まだチャートがありません。';
      ul.appendChild(li0);
    }
    ids.forEach(function (id) {
      var ch = charts[id];
      var li = document.createElement('li');
      var o = document.createElement('button');
      o.type = 'button';
      o.className = 'copen';
      o.setAttribute('aria-current', String(id === curId));
      var b = document.createElement('b');
      b.textContent = chartName(ch);
      var s = document.createElement('span');
      s.textContent = filledCount(ch) + ' / 73 マス記入 · 更新 ' + fmtDate(ch.updated);
      o.appendChild(b);
      o.appendChild(s);
      o.addEventListener('click', function () { curId = id; block = 4; saveUI(); closeList(); render(); });
      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'btn small danger' + (delArmed === id ? ' armed' : '');
      del.textContent = delArmed === id ? '削除する' : '削除';
      del.setAttribute('aria-label', chartName(ch) + 'を削除');
      del.addEventListener('click', function () {
        if (delArmed !== id) {
          delArmed = id;
          clearTimeout(delTimer);
          delTimer = setTimeout(function () { delArmed = null; renderList(); }, 4000);
          renderList();
          return;
        }
        delArmed = null;
        undoStack.push({ id: id, snap: clone(charts[id]) });
        delete charts[id];
        delete dirty[id];
        deleted[id] = Date.now();
        if (curId === id) { curId = null; ensureCur(); }
        saveData();
        saveUI();
        scheduleSync(500);
        render();
        csMsg('削除しました。↶ で元に戻せます。');
      });
      li.appendChild(o);
      li.appendChild(del);
      ul.appendChild(li);
    });
    $('#csDup').hidden = !cur();
  }
  function openList() { delArmed = null; $('#csCopyBox').hidden = true; csMsg(''); renderList(); $('#csWrap').hidden = false; }
  function closeList() { $('#csWrap').hidden = true; }
  function csMsg(t, err) { var m = $('#csMsg'); m.textContent = t; m.className = 'msg' + (err ? ' err' : ''); }

  function addChart(ch) {
    charts[ch.id] = ch;
    if (deleted[ch.id]) delete deleted[ch.id];
    curId = ch.id;
    block = 4;
    undoStack.push({ id: ch.id, snap: null });
    markChanged(ch.id);
    saveUI();
    render();
  }

  function outline(ch) {
    var out = [];
    var mark = function (c) { return c.d ? ' ✓' : ''; };
    out.push('◎ ' + ch.blocks[4][4].t.replace(/\n/g, ' ') + mark(ch.blocks[4][4]));
    ORDER.forEach(function (b, n) {
      var th = ch.blocks[4][b];
      var items = ORDER.filter(function (i) { return ch.blocks[b][i].t; });
      if (!th.t && !items.length) return;
      out.push('');
      out.push((n + 1) + '. ' + (th.t.replace(/\n/g, ' ') || '（テーマ未設定）') + mark(th));
      items.forEach(function (i) { out.push('  ・' + ch.blocks[b][i].t.replace(/\n/g, ' ') + mark(ch.blocks[b][i])); });
    });
    return out.join('\n');
  }

  function stamp() {
    var d = new Date();
    return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
  }
  function exportJSON() {
    var data = JSON.stringify({ app: 'mandala-chart', v: 1, exported: new Date().toISOString(), charts: sortedIds().map(function (k) { return charts[k]; }) }, null, 1);
    var filename = 'mandala_' + stamp() + '.json';
    var file = null;
    try { file = new File([data], filename, { type: 'application/json' }); } catch (e) { /* 古い環境 */ }
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: filename }).then(function () { csMsg('書き出しました。'); }, function () { csMsg('書き出しを取りやめました。'); });
      return;
    }
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    csMsg(filename + ' を書き出しました。');
  }
  function importFile(file) {
    var r = new FileReader();
    r.onload = function () {
      var raw;
      try { raw = JSON.parse(r.result); } catch (e) { csMsg('JSONとして読めませんでした。書き出したファイルを選んでください。', true); return; }
      var list = Array.isArray(raw && raw.charts) ? raw.charts : (raw && raw.blocks ? [raw] : []);
      var n = 0, last = null, now = Date.now();
      list.forEach(function (c) {
        var ch = normalize(c);
        if (!ch) return;
        if (charts[ch.id]) ch.id = uid();
        ch.updated = now;
        ch.blocks.forEach(function (row) { row.forEach(function (cell) { cell.u = now; }); });
        charts[ch.id] = ch;
        if (deleted[ch.id]) delete deleted[ch.id];
        undoStack.push({ id: ch.id, snap: null });
        dirty[ch.id] = true;
        last = ch.id; n++;
      });
      if (!n) { csMsg('チャートが見つかりませんでした。', true); return; }
      curId = last; block = 4;
      saveData();
      saveUI();
      scheduleSync(300);
      render();
      csMsg(n + '件のチャートを読み込みました。');
    };
    r.readAsText(file);
  }

  // ---------- 同期の設定 ----------
  function encodeCode(c) { return CODE_PREFIX + btoa(unescape(encodeURIComponent(JSON.stringify({ u: c.u, k: c.k })))); }
  function decodeCode(s) {
    s = (s || '').trim().replace(/\s+/g, '');
    if (s.indexOf(CODE_PREFIX) !== 0) return null;
    try {
      var o = JSON.parse(decodeURIComponent(escape(atob(s.slice(CODE_PREFIX.length)))));
      if (o && /^https:\/\/script\.google(usercontent)?\.com\//.test(o.u) && o.k) return { u: o.u, k: o.k };
    } catch (e) { /* 読めない */ }
    return null;
  }
  function stMsg(t, err) { var m = $('#stMsg'); m.textContent = t; m.className = 'msg' + (err ? ' err' : ''); }
  function renderSettings() {
    $('#stState').textContent = conf
      ? '接続済み：この端末の変更はGoogleドライブに保存され、スマホとPCで共有されます。' + (sync.last ? '最終同期 ' + fmtDate(sync.last) : '')
      : '未接続：いまはこの端末の中だけに保存しています。接続コードを貼り付けると、Googleドライブ経由でスマホとPCが同じ内容になります。';
    $('#stConnectBox').hidden = !!conf;
    $('#stConnected').hidden = !conf;
    $('#stCodeView').hidden = true;
    $('#stOff').textContent = '接続を解除';
    stOffArmed = false;
  }
  var stOffArmed = false;
  function openSettings() { stMsg(''); renderSettings(); $('#stWrap').hidden = false; }
  function closeSettings() { $('#stWrap').hidden = true; }

  // ---------- イベント ----------
  document.querySelectorAll('.tab').forEach(function (t) { t.addEventListener('click', function () { setView(t.dataset.view); }); });
  $('#undoBtn').addEventListener('click', function () { undo(); });
  $('#chartBtn').addEventListener('click', openList);
  $('#syncBtn').addEventListener('click', openSettings);
  $('#csClose').addEventListener('click', closeList);
  $('#csWrap').addEventListener('click', function (e) { if (e.target === $('#csWrap')) closeList(); });
  $('#csNew').addEventListener('click', function () { closeList(); var ch = newChart(); addChart(ch); view = 'v3'; render(); openEditor(4, 4); });
  $('#csDup').addEventListener('click', function () {
    var src = cur(); if (!src) return;
    var ch = clone(src), now = Date.now();
    ch.id = uid(); ch.created = ch.updated = now;
    ch.blocks.forEach(function (row) { row.forEach(function (cell) { cell.u = now; }); });
    ch.blocks[4][4].t = Array.from(ch.blocks[4][4].t + '（コピー）').slice(0, MAXLEN).join('');
    addChart(ch);
    renderList();
    csMsg('複製しました。');
  });
  $('#csExport').addEventListener('click', exportJSON);
  $('#csImport').addEventListener('click', function () { $('#csFile').click(); });
  $('#csFile').addEventListener('change', function (e) { var f = e.target.files[0]; if (f) importFile(f); e.target.value = ''; });
  $('#csCopy').addEventListener('click', function () {
    var ch = cur(); if (!ch) return;
    var text = outline(ch);
    var box = $('#csCopyBox');
    box.value = text;
    var fallback = function () { box.hidden = false; box.focus(); box.select(); csMsg('下のテキストを選択してコピーしてください。'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { box.hidden = true; csMsg('テキストをコピーしました。メモアプリなどに貼り付けできます。'); }, fallback);
    } else fallback();
  });

  $('#edSave').addEventListener('click', saveEditor);
  $('#edCancel').addEventListener('click', closeEditor);
  $('#edWrap').addEventListener('click', function (e) { if (e.target === $('#edWrap')) closeEditor(); });
  $('#edText').addEventListener('input', updateCount);
  $('#edText').addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveEditor(); } });
  $('#edOpen').addEventListener('click', function () { var i = ed.i; saveEditor(); goBlock(i); });
  $('#edClear').addEventListener('click', function () {
    if (!clearArmed) {
      clearArmed = true;
      var b = $('#edClear');
      b.textContent = 'もう一度で消去';
      b.classList.add('armed');
      clearTimer = setTimeout(disarmClear, 4000);
      return;
    }
    var e = ed;
    closeEditor();
    commit(e.id, function (ch) { ch.blocks[e.b][e.i] = { t: '', c: '', d: false, u: Date.now() }; });
  });

  $('#stClose').addEventListener('click', closeSettings);
  $('#stWrap').addEventListener('click', function (e) { if (e.target === $('#stWrap')) closeSettings(); });
  $('#stConnect').addEventListener('click', function () {
    var c = decodeCode($('#stCode').value);
    if (!c) { stMsg('接続コードを読み取れませんでした。「MANDALA1:」から始まる文字列をすべて貼り付けてください。', true); return; }
    stMsg('接続を確認しています…');
    var prev = conf;
    conf = c;
    Object.keys(charts).forEach(function (id) { dirty[id] = true; });
    runSync().then(function () {
      if (sync.state === 'ok') {
        lsSet(CONF_KEY, conf);
        $('#stCode').value = '';
        renderSettings();
        stMsg('接続しました。Googleドライブのデータと同期しました。');
      } else {
        conf = prev;
        stMsg(sync.err === 'bad_token' ? '合言葉が一致しませんでした。新しい接続コードを確認してください。' : '同期先につながりませんでした。インターネット接続と接続コードを確認してください。', true);
        showSyncState();
      }
    });
  });
  $('#stSyncNow').addEventListener('click', function () {
    stMsg('同期しています…');
    runSync().then(function () {
      if (sync.state === 'ok') stMsg('同期しました（' + hm(sync.last) + '）。');
      else stMsg('同期できませんでした。インターネット接続を確認してください。', true);
      renderSettings();
    });
  });
  $('#stShowCode').addEventListener('click', function () {
    var box = $('#stCodeView');
    box.value = encodeCode(conf);
    box.hidden = false;
    box.focus();
    box.select();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(box.value).then(function () { stMsg('接続コードをコピーしました。もう一方の端末の「同期の設定」に貼り付けてください。'); }, function () { stMsg('表示されたコードを選択してコピーしてください。'); });
    }
  });
  $('#stOff').addEventListener('click', function () {
    if (!stOffArmed) {
      stOffArmed = true;
      $('#stOff').textContent = 'もう一度で解除';
      setTimeout(function () { stOffArmed = false; $('#stOff').textContent = '接続を解除'; }, 4000);
      return;
    }
    conf = null;
    try { localStorage.removeItem(CONF_KEY); } catch (e) { /* 無視 */ }
    sync.state = 'off';
    renderSettings();
    showSyncState();
    render();
    stMsg('接続を解除しました。データはこの端末に残っています。');
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!$('#edWrap').hidden) closeEditor();
    else if (!$('#csWrap').hidden) closeList();
    else if (!$('#stWrap').hidden) closeSettings();
  });

  $('#zoomBtn').addEventListener('click', function () { zoom = !zoom; saveUI(); render(); });
  $('#emptyBtn').addEventListener('click', function () { showEmpty = !showEmpty; saveUI(); render(); });
  $('#openAll').addEventListener('click', function () { collapsed = {}; render(); });
  $('#closeAll').addEventListener('click', function () { ORDER.forEach(function (b) { collapsed[b] = true; }); render(); });
  $('#emptyNew').addEventListener('click', function () { var ch = newChart(); addChart(ch); openEditor(4, 4); });
  $('#emptySync').addEventListener('click', openSettings);

  // 画面に戻ったとき・通信が戻ったとき・一定間隔で同期
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') scheduleSync(100); });
  window.addEventListener('online', function () { scheduleSync(100); });
  window.addEventListener('pageshow', function () { scheduleSync(100); });
  setInterval(function () { if (document.visibilityState === 'visible' && !sync.busy && $('#edWrap').hidden) runSync(); }, 20000);

  // ---------- 起動 ----------
  loadAll();
  ensureCur();
  if (conf) sync.state = 'ok';
  render();
  showSyncState();
  scheduleSync(50);

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function () { /* オフライン機能なしで動く */ });
  }
})();
</script>
</body>
</html>
